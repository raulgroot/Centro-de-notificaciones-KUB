name: CI

# Corre en cada push y en cada PR contra main.
# Si cualquier paso falla, el PR queda con check rojo y sabes antes
# de mergear que rompiste algo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs anteriores del mismo branch si llega un push nuevo —
# ahorra minutos de CI y feedback más rápido.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck · lint · test)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup lee la versión de `packageManager` en package.json
      # (pnpm@10.33.4). NO pasamos `version:` aquí porque eso choca con el
      # campo packageManager y la action rechaza con "Multiple versions".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Corremos los 3 en paralelo lógico (cada uno como step propio para que
      # el log de fallas sea claro). El job entero falla si cualquiera falla.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # Build sanity-check: que el bundle de Next compile contra producción.
  # Más caro que typecheck pero atrapa errores que solo aparecen en build.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          # Variables dummy para que el build pase — el código real las
          # requiere en runtime, no en build (gracias a getters lazy en
          # lib/env.ts). Si el build empieza a fallar por env faltante,
          # primero revisa si introdujiste eager loading.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
